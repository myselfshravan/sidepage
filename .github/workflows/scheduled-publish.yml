name: scheduled-publish

# Vercel Hobby crons run at most daily, so GitHub triggers the scheduler instead.
# The endpoint is idempotent: late, duplicate or overlapping runs are safe, and
# publications are dated at their intended time, not when this job ran.
on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:

permissions: {}

jobs:
  trigger:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Publish due work
        env:
          SITE_URL: ${{ secrets.SIDEPAGE_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          if [ -z "$SITE_URL" ] || [ -z "$CRON_SECRET" ]; then
            echo "SIDEPAGE_URL / CRON_SECRET secrets are not set; skipping."
            exit 0
          fi
          curl --fail-with-body --silent --show-error --max-time 120 \
            -H "Authorization: Bearer $CRON_SECRET" \
            "$SITE_URL/api/cron/publish-due"
